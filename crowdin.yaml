project_id: 295539
api_token_env: CROWDIN_VERDACCIO_API_KEY
# token local testing
# api_token: token_secret

preserve_hierarchy: true

# Only /website/docs is translated. Developer reference lives in /website/dev
# (plugin API, Node API, generated @verdaccio/core reference) and is deliberately
# left out: it is mostly type signatures, and a translated signature that drifts
# from the code is worse than an untranslated one. Do not add /website/dev here.
files:
  - source: /website/i18n/en/**/*
    translation: '/website/i18n/%locale%/**/%original_file_name%'
  - source: /website/docs/**/*
    translation: '/website/i18n/%locale%/docusaurus-plugin-content-docs/current/**/%original_file_name%'
    ignore: [/website/docs/api/**/*]