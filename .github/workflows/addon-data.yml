---
name: addon data

on:
  workflow_dispatch:
  schedule:
    # once per week on Friday
    - cron: "0 0 * * 5"

permissions:
  contents: write

jobs:
  update-addons:
    name: Update addon data
    runs-on: ubuntu-latest
    # Requires manual approval (verdacciobot) via the `metrics` environment.
    environment: metrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Install pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install
      - name: Fetch dependencies
        run: pnpm install
      - name: Build Packages
        run: pnpm build
      - name: Update addon data
        run: pnpm script:addon
      - name: format
        run: pnpm format
      - name: Commit & push
        run: |
          git config user.name  verdacciopack
          git config user.email verdaccio.npm@gmail.com
          git add -A
          git diff --cached --quiet || git commit -m "chore: updated addon data"
          git push origin master
