---
name: static data

on:
  workflow_dispatch:
  schedule:
    # once per week on Friday
    - cron: '0 3 * * 5'

permissions:
  contents: write

jobs:
  prepare:
    name: Run script
    runs-on: ubuntu-latest
    # Requires manual approval (verdacciobot) via the `metrics` environment.
    environment: metrics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Install pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install
      - name: Fetch dependencies
        run: pnpm install
      - name: Build Packages
        run: pnpm build
      - name: Build package
        run: pnpm --filter @verdaccio/local-scripts run build
      - name: Fetch all download stats
        run: pnpm --filter @verdaccio/local-scripts run downloads:all
      - name: Releases update
        run: pnpm --filter @verdaccio/local-scripts run releases:update
      - name: Contributors update
        run: pnpm --filter @verdaccio/local-scripts run contributors:update
        env:
          TOKEN: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
      - name: format
        run: pnpm format
      - name: Commit & push
        run: |
          git config user.name  verdacciopack
          git config user.email verdaccio.npm@gmail.com
          git add -A
          git diff --cached --quiet || git commit -m "chore: updated static data"
          git push origin master
