name: Test Deploy

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Docusaurus
    # Skip forks: only run for non-draft PRs whose head branch lives in this repo.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Install pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install
      - name: Fetch dependencies
        run: pnpm install
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      # The plugin examples under website/dev/examples are compiled against the
      # published @verdaccio/core, so a renamed or removed type fails here instead
      # of shipping as documentation.
      - name: Type-check documentation examples
        run: pnpm --filter @verdaccio/website check:examples
      - name: Build Packages
        run: pnpm build
      - name: Build Translations percentage
        run: pnpm --filter @verdaccio/local-scripts build        
      - name: Build Production
        env:
          CROWDIN_VERDACCIO_API_KEY: ${{ secrets.CROWDIN_VERDACCIO_API_KEY }}
          CONTEXT: production
        run: pnpm --filter @verdaccio/website deploy:build:test
