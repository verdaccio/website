---
name: translations data

on:
  workflow_dispatch:
  schedule:
    # once per week on Friday
    - cron: "0 6 * * 5"

permissions:
  contents: write

jobs:
  update-translations:
    name: Update translations
    runs-on: ubuntu-latest
    # Requires manual approval (verdacciobot) via the `metrics` environment.
    environment: metrics
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
      - name: Install pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          corepack install
      - name: Fetch dependencies
        run: pnpm install
      - name: Build Packages
        run: pnpm build
      - name: Build package
        run: pnpm --filter @verdaccio/local-scripts run build
      - name: Update translations
        run: pnpm run translations
        env:
          TOKEN: ${{ secrets.CROWDIN_VERDACCIO_API_KEY }}
      - name: format
        run: pnpm format
      - name: Commit & push
        run: |
          git config user.name  verdacciopack
          git config user.email verdaccio.npm@gmail.com
          git add -A
          git diff --cached --quiet || git commit -m "chore: updated translations data"
          git push origin master
